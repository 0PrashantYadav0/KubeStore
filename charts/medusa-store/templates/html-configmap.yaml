apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medusa-store.fullname" . }}-html
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>{{ .Values.store.name | default "My Store" }} - KubeStore</title>
      <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #fff;
        }
        .container {
          text-align: center;
          padding: 3rem;
          background: rgba(255, 255, 255, 0.05);
          border-radius: 24px;
          backdrop-filter: blur(10px);
          border: 1px solid rgba(255, 255, 255, 0.1);
          max-width: 600px;
          margin: 1rem;
        }
        .logo {
          font-size: 4rem;
          margin-bottom: 1rem;
        }
        h1 {
          font-size: 2.5rem;
          margin-bottom: 0.5rem;
          background: linear-gradient(135deg, #7c3aed, #a855f7);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .store-id {
          font-family: monospace;
          color: #a0a0b0;
          font-size: 0.875rem;
          margin-bottom: 1.5rem;
        }
        .status {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          background: rgba(16, 185, 129, 0.15);
          color: #10b981;
          padding: 0.5rem 1rem;
          border-radius: 999px;
          font-weight: 600;
          margin-bottom: 2rem;
        }
        .status::before {
          content: '';
          width: 8px;
          height: 8px;
          background: #10b981;
          border-radius: 50%;
          animation: pulse 2s infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        .info {
          color: #a0a0b0;
          line-height: 1.8;
        }
        .info strong {
          color: #fff;
        }
        .badge {
          display: inline-block;
          background: rgba(124, 58, 237, 0.2);
          color: #a855f7;
          padding: 0.25rem 0.75rem;
          border-radius: 6px;
          font-size: 0.75rem;
          margin-top: 1.5rem;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="logo">🏪</div>
        <h1>{{ .Values.store.name | default "My Store" }}</h1>
        <div class="store-id">Store ID: {{ .Values.store.id | default "unknown" }}</div>
        <div class="status">Live</div>
        <p class="info">
          Your e-commerce store is <strong>running</strong> and ready to serve customers!<br>
          Powered by <strong>KubeStore Platform</strong> on Kubernetes.
        </p>
        <div class="badge">Provisioned by Helm</div>
      </div>
    </body>
    </html>
