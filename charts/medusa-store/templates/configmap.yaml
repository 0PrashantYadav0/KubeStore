apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medusa-store.fullname" . }}-config
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.medusa.env.NODE_ENV | quote }}
  MEDUSA_BACKEND_URL: {{ printf "http://store-%s.%s" (include "medusa-store.storeId" .) .Values.ingress.baseDomain | quote }}
  STORE_CORS: "*"
  ADMIN_CORS: "*"
