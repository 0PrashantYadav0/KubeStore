apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medusa-store.fullname" . }}-config
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.medusa.env.NODE_ENV | quote }}
  STORE_CORS: {{ .Values.medusa.env.STORE_CORS | default "*" | quote }}
  ADMIN_CORS: {{ .Values.medusa.env.ADMIN_CORS | default "*" | quote }}
  AUTH_CORS: "*"
  STORE_ID: {{ include "medusa-store.storeId" . | quote }}
  STORE_NAME: {{ .Values.store.name | default "Store" | quote }}
