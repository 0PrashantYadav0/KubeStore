{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medusa-store.fullname" . }}-ingress
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "medusa-store.ingressHost" . }}
      secretName: {{ include "medusa-store.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ include "medusa-store.ingressHost" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
{{- end }}
