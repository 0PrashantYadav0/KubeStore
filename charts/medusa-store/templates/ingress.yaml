{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medusa-store.fullname" . }}-ingress
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.tls .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ include "medusa-store.ingressHost" . }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "medusa-store.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ include "medusa-store.ingressHost" . }}
      http:
        paths:
          # API routes go to Medusa backend
          - path: /store
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          # Medusa v2 Admin (default path)
          - path: /app
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          {{- if .Values.storefront.enabled }}
          # Frontend routes go to Next.js storefront
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-storefront
                port:
                  number: {{ .Values.storefront.port | default 3000 }}
          {{- else }}
          # Fallback to Medusa backend for static files
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "medusa-store.fullname" . }}-medusa
                port:
                  number: {{ .Values.service.port }}
          {{- end }}
{{- end }}
