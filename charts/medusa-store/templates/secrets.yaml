apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medusa-store.fullname" . }}-secrets
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL credentials
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  
  # Medusa secrets
  JWT_SECRET: {{ .Values.medusa.env.JWT_SECRET | quote }}
  COOKIE_SECRET: {{ .Values.medusa.env.COOKIE_SECRET | quote }}
  
  # Database URL for Medusa
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "medusa-store.postgresHost" .) .Values.postgresql.auth.database | quote }}
  
  # Redis URL
  REDIS_URL: {{ printf "redis://%s:6379" (include "medusa-store.redisHost" .) | quote }}
