{{/*
Secrets are generated once and then persisted by reusing the existing Secret on
subsequent Helm upgrades. This avoids breaking JWT sessions, cookies, and
Postgres credentials on upgrade/rollback.
*/}}
{{- $secretName := printf "%s-secrets" (include "medusa-store.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}

{{- $pgUser := .Values.postgresql.username -}}
{{- $pgDB := .Values.postgresql.database -}}
{{- $pgPass := default "" .Values.postgresql.password -}}
{{- if and $existing (index $existing.data "POSTGRES_PASSWORD") -}}
{{- $pgPass = (index $existing.data "POSTGRES_PASSWORD" | b64dec) -}}
{{- else if eq $pgPass "" -}}
{{- $pgPass = randAlphaNum 32 -}}
{{- end -}}

{{- $adminEmail := .Values.medusa.admin.email -}}
{{- $adminPass := default "" .Values.medusa.admin.password -}}
{{- if and $existing (index $existing.data "ADMIN_PASSWORD") -}}
{{- $adminPass = (index $existing.data "ADMIN_PASSWORD" | b64dec) -}}
{{- else if eq $adminPass "" -}}
{{- $adminPass = randAlphaNum 24 -}}
{{- end -}}

{{- $jwtSecret := "" -}}
{{- if and $existing (index $existing.data "JWT_SECRET") -}}
{{- $jwtSecret = (index $existing.data "JWT_SECRET" | b64dec) -}}
{{- else -}}
{{- $jwtSecret = randAlphaNum 32 -}}
{{- end -}}

{{- $cookieSecret := "" -}}
{{- if and $existing (index $existing.data "COOKIE_SECRET") -}}
{{- $cookieSecret = (index $existing.data "COOKIE_SECRET" | b64dec) -}}
{{- else -}}
{{- $cookieSecret = randAlphaNum 32 -}}
{{- end -}}

{{- $publishableKey := "" -}}
{{- if and $existing (index $existing.data "PUBLISHABLE_API_KEY") -}}
{{- $publishableKey = (index $existing.data "PUBLISHABLE_API_KEY" | b64dec) -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medusa-store.fullname" . }}-secrets
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $pgUser | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  POSTGRES_DB: {{ $pgDB | quote }}

  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pgUser $pgPass (include "medusa-store.postgresHost" .) $pgDB | quote }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "medusa-store.redisHost" .) | quote }}

  JWT_SECRET: {{ $jwtSecret | quote }}
  COOKIE_SECRET: {{ $cookieSecret | quote }}

  ADMIN_EMAIL: {{ $adminEmail | quote }}
  ADMIN_PASSWORD: {{ $adminPass | quote }}

  # Filled by a post-install bootstrap Job.
  PUBLISHABLE_API_KEY: {{ $publishableKey | quote }}
