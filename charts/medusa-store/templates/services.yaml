# Medusa Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.fullname" . }}-medusa
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: medusa
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: medusa
---
# PostgreSQL Service
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.postgresHost" . }}
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
---
# Redis Service
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.redisHost" . }}
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
