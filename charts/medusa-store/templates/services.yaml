apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.fullname" . }}-medusa
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: medusa
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: medusa
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.fullname" . }}-postgresql
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "medusa-store.fullname" . }}-redis
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    {{- include "medusa-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
