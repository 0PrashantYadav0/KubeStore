{{- if .Values.resourceQuota.enabled }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "medusa-store.fullname" . }}-quota
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
spec:
  hard:
    {{- range $key, $value := .Values.resourceQuota.limits }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
{{- end }}
---
{{- if .Values.limitRange.enabled }}
apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "medusa-store.fullname" . }}-limits
  labels:
    {{- include "medusa-store.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        memory: {{ .Values.limitRange.default.memory | quote }}
        cpu: {{ .Values.limitRange.default.cpu | quote }}
      defaultRequest:
        memory: {{ .Values.limitRange.defaultRequest.memory | quote }}
        cpu: {{ .Values.limitRange.defaultRequest.cpu | quote }}
      max:
        memory: {{ .Values.limitRange.max.memory | quote }}
        cpu: {{ .Values.limitRange.max.cpu | quote }}
{{- end }}
