apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  replicas: {{ .Values.wordpress.replicas }}
  selector:
    matchLabels:
      {{- include "woocommerce-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: wordpress
  template:
    metadata:
      labels:
        {{- include "woocommerce-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: wordpress
    spec:
      {{- if .Values.rbac.enabled }}
      serviceAccountName: {{ include "woocommerce-store.fullname" . }}-sa
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Wait for MariaDB to be ready
        - name: wait-for-mariadb
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB..."
              until nc -z {{ include "woocommerce-store.mariadbHost" . }} 3306; do
                echo "MariaDB not ready, waiting..."
                sleep 2
              done
              echo "MariaDB is ready!"
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "woocommerce-store.fullname" . }}-config
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: WORDPRESS_DB_HOST
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: WORDPRESS_DB_PASSWORD
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: WORDPRESS_DB_NAME
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          {{- with .Values.wordpress.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.wordpress.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          emptyDir: {}
