apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-mariadb
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ include "woocommerce-store.fullname" . }}-mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "woocommerce-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mariadb
  template:
    metadata:
      labels:
        {{- include "woocommerce-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      {{- if .Values.rbac.enabled }}
      serviceAccountName: {{ include "woocommerce-store.fullname" . }}-sa
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: MARIADB_PASSWORD
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: MARIADB_DATABASE
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "woocommerce-store.fullname" . }}-secrets
                  key: MARIADB_ROOT_PASSWORD
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb -u$MARIADB_USER -p$MARIADB_PASSWORD -e 'SELECT 1'"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mariadb -u$MARIADB_USER -p$MARIADB_PASSWORD -e 'SELECT 1'"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mariadb.storage.size }}
