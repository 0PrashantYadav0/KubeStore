{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-sa
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-role
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-rolebinding
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "woocommerce-store.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "woocommerce-store.fullname" . }}-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
