# WordPress Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-wordpress
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "woocommerce-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: wordpress
---
# MariaDB Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-mariadb
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "woocommerce-store.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
