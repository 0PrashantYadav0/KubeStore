apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-config
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
data:
  STORE_ID: {{ include "woocommerce-store.storeId" . | quote }}
  STORE_NAME: {{ .Values.store.name | default "Store" | quote }}
  WORDPRESS_DEBUG: {{ .Values.wordpress.env.WORDPRESS_DEBUG | default "0" | quote }}
  WP_SITEURL: {{ printf "http://%s" (include "woocommerce-store.ingressHost" .) | quote }}
  WP_HOME: {{ printf "http://%s" (include "woocommerce-store.ingressHost" .) | quote }}
