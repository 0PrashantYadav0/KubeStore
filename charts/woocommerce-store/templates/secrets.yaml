{{/*
Secrets are generated once and reused on subsequent upgrades (via lookup).
*/}}
{{- $secretName := printf "%s-secrets" (include "woocommerce-store.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}

{{- $dbUser := .Values.mariadb.username -}}
{{- $dbName := .Values.mariadb.database -}}
{{- $dbPass := default "" .Values.mariadb.password -}}
{{- if and $existing (index $existing.data "MARIADB_PASSWORD") -}}
{{- $dbPass = (index $existing.data "MARIADB_PASSWORD" | b64dec) -}}
{{- else if eq $dbPass "" -}}
{{- $dbPass = randAlphaNum 32 -}}
{{- end -}}

{{- $wpAdminUser := .Values.wordpress.admin.user -}}
{{- $wpAdminPass := default "" .Values.wordpress.admin.password -}}
{{- if and $existing (index $existing.data "WP_ADMIN_PASSWORD") -}}
{{- $wpAdminPass = (index $existing.data "WP_ADMIN_PASSWORD" | b64dec) -}}
{{- else if eq $wpAdminPass "" -}}
{{- $wpAdminPass = randAlphaNum 24 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "woocommerce-store.fullname" . }}-secrets
  labels:
    {{- include "woocommerce-store.labels" . | nindent 4 }}
type: Opaque
stringData:
  MARIADB_USER: {{ $dbUser | quote }}
  MARIADB_PASSWORD: {{ $dbPass | quote }}
  MARIADB_DATABASE: {{ $dbName | quote }}
  MARIADB_ROOT_PASSWORD: {{ $dbPass | quote }}

  WORDPRESS_DB_HOST: {{ include "woocommerce-store.mariadbHost" . | quote }}
  WORDPRESS_DB_USER: {{ $dbUser | quote }}
  WORDPRESS_DB_PASSWORD: {{ $dbPass | quote }}
  WORDPRESS_DB_NAME: {{ $dbName | quote }}

  WP_ADMIN_USER: {{ $wpAdminUser | quote }}
  WP_ADMIN_PASSWORD: {{ $wpAdminPass | quote }}
  WP_ADMIN_EMAIL: {{ .Values.wordpress.admin.email | quote }}
