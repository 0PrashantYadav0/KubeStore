# Local development defaults (Kind/k3d/Minikube).

backend:
  image:
    repository: kubestore-backend
    tag: "latest"
    pullPolicy: Never
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # Persistent store DB (BoltDB)
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: ""

dashboard:
  image:
    repository: kubestore-dashboard
    tag: "latest"
    pullPolicy: Never
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  baseDomain: "127.0.0.1.nip.io"
  host: "dashboard.127.0.0.1.nip.io"
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# Controls for stores that the platform provisions.
stores:
  baseDomain: "127.0.0.1.nip.io"
  valuesFile: "/charts/medusa-store/values-local.yaml"

limits:
  maxStoresTotal: 50
  maxStoresPerUser: 5
  provisionWorkers: 3

