apiVersion: v1
kind: Service
metadata:
  name: kubestore-dashboard
  labels:
    {{- include "kubestore-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}

